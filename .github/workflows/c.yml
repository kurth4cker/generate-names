name: C

on:
  push:
    branches:
      - "trunk"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}

    strategy:
      matrix:
        include:
          - os: alpine
            cc: gcc
            image: alpine:latest
            install: apk add gcc libc-dev

          - os: debian
            cc: gcc
            image: debian:latest
            install: apt update && apt install -y gcc

          - os: debian
            cc: clang
            image: debian:latest
            install: apt update && apt install -y clang

    env:
      CC: ${{ matrix.cc }}
      CFLAGS: -Wall -Wextra -Werror

    steps:
      - name: Install Dependencies
        run: ${{ matrix.install }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap nob
        run: $CC $CFLAGS -o nob nob.c

      - name: Build
        run: ./nob

      - name: Run Program
        run: ./generate-names


  macos:
    runs-on: macos-latest
    steps:
      # Note: gcc is already installed on macos runner
      # - name: Install Dependencies
      #   run: brew install gcc

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap nob
        run: cc -Werror -o nob nob.c

      - name: Build
        run: ./nob

      - name: Run Program
        run: ./generate-names
